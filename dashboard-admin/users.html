<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Peserta — PalembangPy</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body>
  <script src="app.js"></script>
  <script>
    let users = [], events = [], selectedEventId = '';

    function renderFilterAndTable() {
      const eventSelect = document.getElementById('eventFilter');
      const tbody = document.getElementById('userTableBody');

      eventSelect.innerHTML = `<option value="">-- Semua Event --</option>` +
        events.map(e => `<option value="${e.id}" ${selectedEventId === String(e.id) ? 'selected' : ''}>${e.name}</option>`).join('');

      const filtered = selectedEventId ? users.filter(u => String(u.event_id) === selectedEventId) : users;
      document.getElementById('totalPeserta').textContent = filtered.length;

      tbody.innerHTML = filtered.length ? filtered.map(u => {
        const event = events.find(e => e.id === u.event_id);
        return `
        <tr class="hover:bg-slate-50/70 transition-colors">
          <td class="px-3 md:px-5 py-2.5 md:py-3">
            <div class="flex items-center gap-2 md:gap-3">
              <div class="w-7 h-7 md:w-9 md:h-9 rounded-full bg-gradient-to-br from-indigo-400 to-blue-500 flex items-center justify-center text-white text-[10px] md:text-xs font-bold flex-shrink-0">
                ${u.name.charAt(0)}
              </div>
              <div class="min-w-0">
                <div class="font-medium text-slate-700 text-xs md:text-sm truncate">${u.name}</div>
                <div class="text-[10px] md:text-xs text-slate-400 truncate">${u.telegram_id}</div>
              </div>
            </div>
          </td>
          <td class="px-3 md:px-5 py-2.5 md:py-3 text-slate-500 text-xs md:text-sm hidden md:table-cell">${event ? event.name : '-'}</td>
          <td class="px-3 md:px-5 py-2.5 md:py-3 hidden sm:table-cell">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 md:px-2.5 md:py-1 rounded-full text-[10px] md:text-xs font-medium ${u.checked_in_at ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
              <i class="fa ${u.checked_in_at ? 'fa-check-circle' : 'fa-clock-o'}"></i>
              ${u.checked_in_at ? 'Sudah' : 'Belum'}
            </span>
          </td>
          <td class="px-3 md:px-5 py-2.5 md:py-3 text-slate-500 text-xs md:text-sm hidden lg:table-cell">
            ${u.checked_in_at ? new Date(u.checked_in_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '-'}
          </td>
        </tr>
      `}).join('') : '<tr><td colspan="4" class="py-10 md:py-16 text-center"><div class="text-slate-300 text-3xl md:text-4xl mb-2"><i class="fa fa-users"></i></div><p class="text-xs md:text-sm text-slate-400">Belum ada peserta</p></td></tr>';
    }

    function exportCSV() {
      const filtered = selectedEventId ? users.filter(u => String(u.event_id) === selectedEventId) : users;
      if (!filtered.length) return alert('Tidak ada data untuk diekspor');
      let csv = 'Nama,Telegram ID,Event,Status Check-in,Waktu Hadir\n';
      filtered.forEach(u => {
        const event = events.find(e => e.id === u.event_id);
        csv += `"${u.name}","${u.telegram_id}","${event ? event.name : ''}","${u.checked_in_at ? 'Sudah' : 'Belum'}","${u.checked_in_at || ''}"\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = `peserta_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    async function init() {
      const ok = await checkAuth();
      if (!ok) return;
      users = await getUsers();
      events = await getEvents();

      const content = `
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 md:mb-6">
          <div>
            <h2 class="text-lg md:text-2xl font-bold text-slate-800">Data Peserta</h2>
            <p class="text-xs md:text-sm text-slate-500 mt-0.5">Total: <span id="totalPeserta" class="font-semibold text-indigo-600">0</span> peserta</p>
          </div>
          <button id="exportBtn" class="inline-flex items-center justify-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs md:text-sm font-semibold px-3 md:px-4 py-2 md:py-2.5 rounded-xl shadow-lg shadow-emerald-500/25 hover:shadow-xl transition-all hover:-translate-y-0.5">
            <i class="fa fa-download"></i>
            <span class="hidden sm:inline">Export CSV</span>
            <span class="sm:hidden">Export</span>
          </button>
        </div>

        <!-- Filter -->
        <div class="bg-white rounded-xl md:rounded-2xl shadow-sm border border-slate-100 p-3 md:p-4 mb-3 md:mb-4">
          <label class="block text-[10px] md:text-xs font-semibold text-slate-600 mb-1.5 md:mb-2">Filter Event</label>
          <select id="eventFilter" class="w-full sm:w-64 px-3 py-2 text-xs md:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
          </select>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl md:rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-xs md:text-sm">
              <thead>
                <tr class="text-left text-slate-500 bg-slate-50/50">
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider">Peserta</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider hidden md:table-cell">Event</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider hidden sm:table-cell">Check-in</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider hidden lg:table-cell">Waktu</th>
                </tr>
              </thead>
              <tbody id="userTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      `;

      document.body.innerHTML = renderLayout('users', content);
      initLayoutEvents();
      document.getElementById('exportBtn').addEventListener('click', exportCSV);
      document.getElementById('eventFilter').addEventListener('change', e => { selectedEventId = e.target.value; renderFilterAndTable(); });
      renderFilterAndTable();
    }
    init();
  </script>
</body>
</html>
