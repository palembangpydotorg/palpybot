<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PalembangPy</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .bg-pattern {
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-100/40 bg-pattern flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Card Login -->
    <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-2xl shadow-indigo-500/10 border border-white/60 p-6 md:p-8">
      <!-- Logo -->
      <div class="text-center mb-6 md:mb-8">
        <div class="w-14 h-14 md:w-16 md:h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 via-blue-500 to-indigo-600 flex items-center justify-center shadow-xl shadow-indigo-500/30 mb-4">
          <i class="fa fa-code text-white text-xl md:text-2xl"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent">PalembangPy</h1>
        <p class="text-xs md:text-sm text-slate-500 mt-1">Sistem Manajemen Event</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <!-- Username -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Username</label>
          <div class="relative">
            <i class="fa fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="username" required class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all" placeholder="Masukkan username">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Kata Sandi</label>
          <div class="relative">
            <i class="fa fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="password" id="password" required class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all" placeholder="Masukkan kata sandi">
          </div>
        </div>

        <!-- Button -->
        <button type="submit" class="w-full mt-2 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl shadow-lg shadow-indigo-500/30 hover:shadow-xl hover:shadow-indigo-500/40 transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0">
          <i class="fa fa-sign-in mr-2"></i>Masuk
        </button>
      </form>

      <p class="text-center text-[10px] text-slate-400 mt-5">Demo: isi apapun lalu klik Masuk</p>
    </div>

    <!-- Footer -->
    <p class="text-center text-[10px] text-slate-400 mt-4">© 2026 Palembang Python Community</p>
  </div>

  <script>
    const STORAGE_KEY = 'palembangpy_token';
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      localStorage.setItem(STORAGE_KEY, 'dummy_' + Date.now());
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
