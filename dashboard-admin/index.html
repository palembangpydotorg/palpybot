<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PalembangPy</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body>
  <script src="app.js"></script>
  <script>
    (async () => {
      const ok = await checkAuth();
      if (!ok) return;

      const events = await getEvents();
      const users = await getUsers();
      const partners = await getPartners();
      const activeEvents = events.filter(e => e.status === 'Akan Datang' || e.status === 'Berlangsung').length;

      const stats = [
        { label: 'Total Event', value: events.length, icon: 'fa-calendar-alt', color: 'from-indigo-500 to-blue-600', bg: 'bg-indigo-50', text: 'text-indigo-600' },
        { label: 'Event Aktif', value: activeEvents, icon: 'fa-play-circle', color: 'from-emerald-500 to-teal-600', bg: 'bg-emerald-50', text: 'text-emerald-600' },
        { label: 'Total Peserta', value: users.length, icon: 'fa-users', color: 'from-blue-500 to-cyan-600', bg: 'bg-blue-50', text: 'text-blue-600' },
        { label: 'Mitra', value: partners.length, icon: 'fa-handshake-o', color: 'from-amber-500 to-orange-600', bg: 'bg-amber-50', text: 'text-amber-600' }
      ];

      const content = `
        <!-- Header -->
        <div class="mb-4 md:mb-6">
          <h2 class="text-lg md:text-2xl font-bold text-slate-800">Dashboard</h2>
          <p class="text-xs md:text-sm text-slate-500 mt-0.5">Selamat datang kembali, Admin 👋</p>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4 mb-5 md:mb-8">
          ${stats.map(s => `
            <div class="group bg-white rounded-xl md:rounded-2xl p-3 md:p-5 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border border-slate-100">
              <div class="flex items-start justify-between">
                <div>
                  <p class="text-[10px] md:text-xs text-slate-500 font-medium">${s.label}</p>
                  <p class="text-xl md:text-3xl font-bold text-slate-800 mt-1 md:mt-2">${s.value}</p>
                </div>
                <div class="w-8 h-8 md:w-12 md:h-12 rounded-lg md:rounded-xl ${s.bg} ${s.text} flex items-center justify-center group-hover:scale-110 transition-transform">
                  <i class="fa ${s.icon} text-xs md:text-base"></i>
                </div>
              </div>
              <div class="mt-2 md:mt-3 h-1 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full bg-gradient-to-r ${s.color} rounded-full" style="width: ${Math.min(s.value * 10, 100)}%"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Event Terbaru -->
        <div class="bg-white rounded-xl md:rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="flex items-center justify-between p-3 md:p-5 border-b border-slate-100">
            <div>
              <h3 class="text-sm md:text-base font-semibold text-slate-800">Event Terbaru</h3>
              <p class="text-[10px] md:text-xs text-slate-500 mt-0.5 hidden sm:block">Daftar event komunitas</p>
            </div>
            <a href="events.html" class="text-xs md:text-sm font-medium text-indigo-600 hover:text-indigo-700 flex items-center gap-1">
              Lihat semua <i class="fa fa-arrow-right text-[10px]"></i>
            </a>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs md:text-sm">
              <thead>
                <tr class="text-left text-slate-500 bg-slate-50/50">
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider">Nama Event</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider hidden sm:table-cell">Tanggal</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider hidden md:table-cell">Lokasi</th>
                  <th class="px-3 md:px-5 py-2.5 md:py-3 font-semibold text-[10px] md:text-xs uppercase tracking-wider">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${events.slice(0, 5).map(e => `
                  <tr class="hover:bg-slate-50/70 transition-colors">
                    <td class="px-3 md:px-5 py-2.5 md:py-3 font-medium text-slate-700">${e.name}</td>
                    <td class="px-3 md:px-5 py-2.5 md:py-3 text-slate-500 hidden sm:table-cell">
                      <i class="fa fa-calendar-o mr-1.5 text-slate-400"></i>${e.date}
                    </td>
                    <td class="px-3 md:px-5 py-2.5 md:py-3 text-slate-500 hidden md:table-cell">
                      <i class="fa fa-map-marker mr-1.5 text-slate-400"></i>${e.location}
                    </td>
                    <td class="px-3 md:px-5 py-2.5 md:py-3">
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 md:px-2.5 md:py-1 rounded-full text-[10px] md:text-xs font-medium ${
                        e.status === 'Akan Datang' ? 'bg-blue-50 text-blue-700' : 
                        e.status === 'Berlangsung' ? 'bg-emerald-50 text-emerald-700' : 
                        'bg-slate-100 text-slate-600'
                      }">
                        <span class="w-1.5 h-1.5 rounded-full ${
                          e.status === 'Akan Datang' ? 'bg-blue-500' : 
                          e.status === 'Berlangsung' ? 'bg-emerald-500 animate-pulse' : 
                          'bg-slate-400'
                        }"></span>
                        ${e.status}
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.body.innerHTML = renderLayout('dashboard', content);
      initLayoutEvents();
    })();
  </script>
</body>
</html>
